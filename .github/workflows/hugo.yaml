name: Build and deploy site

on:
  push:
    branches: [master, hugo-setup]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The PaperMod theme needs a recent Hugo (see themes/PaperMod/theme.toml, min_version).
      # Pinned to the version of the first green deploy. To upgrade, change HUGO_VERSION.
      - name: Install Hugo (extended)
        env:
          HUGO_VERSION: 0.168.0
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fsSL -o "$RUNNER_TEMP/hugo/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          sudo mv "$RUNNER_TEMP/hugo/hugo" /usr/local/bin/hugo
          hugo version

      - name: Build the site
        run: hugo --gc --minify

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Only the master branch is published. Other branches and pull requests just build.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
