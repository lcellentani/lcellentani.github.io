baseURL = "https://lcellentani.github.io/"
languageCode = "en-us"
title = "NIH"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = false
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowShareButtons = false
  ShowToc = false
  description = "Notes on game engines, C++ and AI-assisted development."

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon/favicon-16x16.png"
    favicon32x32 = "/favicon/favicon-32x32.png"
    apple_touch_icon = "/favicon/apple-touch-icon.png"

  [params.homeInfoParams]
    Title = "Ludovico Cellentani"
    Content = "Game engine developer. I write about C++, rendering and AI-assisted development."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lcellentani"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archive"
    name = "Archive 2019"
    url = "/post/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
